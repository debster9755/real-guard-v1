[project]
name = "real-guard-v1"
version = "0.1.0"
description = "Open-source AI Firewall / FWaaS for LLM and agent traffic"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.23,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",  # Phase 4: Starlette Request.form() for the dashboard login POST
    "prometheus-client>=0.21,<1.0",
    "structlog>=24.4,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<8.0",
    "hypothesis>=6.115,<7.0",
    "respx>=0.21,<1.0",
    "openai>=1.54,<2.0",
    "openapi-spec-validator>=0.7,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "types-PyYAML",
    "types-jsonschema",
    "playwright==1.55.0",  # Phase 9 gap-closure (ADR 0012): real headless-Chromium
    # verification of the reviewer dashboard — CSP enforcement, HTMX DOM swaps,
    # real screenshots. Requires a one-time `playwright install chromium` (and,
    # on Linux, `playwright install-deps chromium`) after `pip install -e .[dev]`;
    # the `browser`-marked tests below skip cleanly, not fail, if that step was
    # never run in the current environment.
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# WS-11: templates and vendored dashboard assets (no CDN — SPEC.md §2.19)
# must ship inside the installed package, not just the source checkout.
app = ["templates/dashboard/*.html", "static/*.css", "static/vendor/*"]

# --- Ruff ------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S"]
ignore = [
    "S101",  # assert is expected in tests and in fail-fast application code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106"]  # asserts, 0.0.0.0 test fixtures and
# literal test secrets are fine in tests — these never bind a real socket or
# guard a real credential.
"tests/test_docker_smoke.py" = ["S603", "S607"]  # deliberate, hardcoded
# `subprocess.run(["docker", ...])` calls driving the Phase 5 Docker smoke
# test (PLAN.md WS-15) — every argument list is a fixed literal, never
# user/network input, and the whole point of the test is to invoke the
# `docker` CLI by its name on PATH.

# --- mypy --------------------------------------------------------------
# Strict on app/ (WS-01 acceptance criterion); relaxed on tests/ per the
# documented risk mitigation (PLAN.md WS-01: "strict on app/, relaxed on tests/").
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# --- pytest ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: full-transaction end-to-end tests (Phase 4+)",
    "security: security-regression tests mapped to SPEC.md §19",
    "bench: load/latency benchmark tests (nightly, Phase 7)",
    "docker: tests that require the built Docker image",
    "docs: README command extraction tests (Phase 8)",
    "ollama: tests requiring a real local Ollama with qwen3:8b (Phase 5); skip, never fail, when unavailable",
    "browser: tests requiring a real, launchable headless Chromium via Playwright (Phase 9, ADR 0012); skip, never fail, when unavailable",
]

[tool.coverage.run]
source = ["app"]
branch = true
