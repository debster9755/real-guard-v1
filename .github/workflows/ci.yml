name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy --strict on app/
        run: mypy app

      - name: Contract validation (policy schema, 54-case corpus, OpenAPI)
        run: python scripts/validate_contracts.py

      - name: pytest with coverage
        # WS-15's own CI requirement ("a CI Docker smoke test running the
        # README's three curl commands against the built image") is met by
        # this same step, not a separate job: tests/test_docker_smoke.py is
        # collected here, builds the real Dockerfile image and runs the
        # three README quick-start requests against it over real HTTP —
        # GitHub-hosted ubuntu-latest runners ship a running Docker daemon,
        # so it executes for real rather than skipping. tests/test_ollama_live.py
        # self-skips here (no host Ollama in this runner) per PLAN.md Phase
        # 5's own acceptance note — "skipped, not failed, in CI where no
        # Ollama exists" — see both files' docstrings and the `docker`/
        # `ollama` marker definitions in pyproject.toml.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Phase 6 / WS-17 (docs/adr/0008-phase6-rate-limiting-metrics-and-security-scanning.md):
  # pip-audit against the production dependency set, and Trivy against the
  # actual built image — both run for real against this repository during
  # that ADR's own writing (not assumed to pass), which is how the
  # Dockerfile fix two steps below (removing pip's own vendored copies of
  # msgpack/setuptools, neither a real-guard-v1 dependency) was found.
  security:
    name: security (pip-audit, Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit against the production dependency set only
        # Deliberately `pip install .` (base deps), never `.[dev]` — the
        # same set the Dockerfile's runtime image actually ships. A dev-only
        # tool vulnerability (e.g. pytest's own advisories) would fail this
        # step for no reason a production deployment could act on.
        run: |
          python -m venv /tmp/prod-only-venv
          /tmp/prod-only-venv/bin/pip install --quiet --upgrade pip
          /tmp/prod-only-venv/bin/pip install --quiet .
          /tmp/prod-only-venv/bin/pip install --quiet pip-audit
          /tmp/prod-only-venv/bin/pip-audit

      - name: Build the runtime image
        run: docker build -t real-guard-v1:ci-scan .

      - name: Trivy image scan (fixable HIGH/CRITICAL only)
        # `--ignore-unfixed`: a handful of the pinned Debian base image's OS
        # packages carry HIGH/CRITICAL CVEs with no upstream fix available
        # yet (verified against the latest published `python:3.12-slim`
        # digest at the time ADR 0008 was written) — failing CI on a
        # vulnerability nothing in this repository can act on would make
        # the check permanently red through no fault of any future change.
        # Every *fixable* HIGH/CRITICAL finding still fails the build.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 real-guard-v1:ci-scan
