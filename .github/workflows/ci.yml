name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy --strict on app/
        run: mypy app

      - name: Contract validation (policy schema, 54-case corpus, OpenAPI)
        run: python scripts/validate_contracts.py

      - name: OpenAPI drift check (Phase 8 / docs/adr/0010)
        # PLAN.md §12 anti-drift automation item 3: "regenerates openapi.json
        # from the running app and fails if it differs from the committed
        # file, so the API contract cannot change silently." Runs before the
        # test suite so a stale, hand-edited openapi.json fails fast with a
        # readable diff rather than being caught incidentally by some other
        # check.
        run: python scripts/generate_openapi.py --check

      - name: pytest with coverage
        # WS-15's own CI requirement ("a CI Docker smoke test running the
        # README's three curl commands against the built image") is met by
        # this same step, not a separate job: tests/test_docker_smoke.py is
        # collected here, builds the real Dockerfile image and runs the
        # three README quick-start requests against it over real HTTP —
        # GitHub-hosted ubuntu-latest runners ship a running Docker daemon,
        # so it executes for real rather than skipping. tests/test_ollama_live.py
        # self-skips here (no host Ollama in this runner) per PLAN.md Phase
        # 5's own acceptance note — "skipped, not failed, in CI where no
        # Ollama exists" — see both files' docstrings and the `docker`/
        # `ollama` marker definitions in pyproject.toml. Phase 8's docs
        # suite (tests/test_readme_commands.py, test_docs_links.py,
        # test_docs_placeholders.py, test_docs_numbers.py,
        # test_docs_no_overclaiming.py — the `docs` marker) is collected
        # here too, with no marker filter excluding it: the README-command
        # extraction test (DOC-004), the internal-link checker, the
        # placeholder grep (DOC-012, now covering every published Markdown
        # file), and the numeric-claim trace (DOC-010) all run as part of
        # this one step.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -q

      - name: "Coverage gate (PLAN.md §10.2 G14: >= 85% line, >= 75% branch)"
        # Phase 7 / WS-14 ("a coverage gate" — see
        # docs/adr/0009-phase7-benchmarking-and-adversarial-review.md):
        # coverage.py's own --fail-under enforces one blended percentage,
        # not G14's two separate line/branch thresholds, so this reads the
        # coverage.xml the previous step already produced instead.
        run: python scripts/check_coverage_gates.py coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  # Phase 6 / WS-17 (docs/adr/0008-phase6-rate-limiting-metrics-and-security-scanning.md):
  # pip-audit against the production dependency set, and Trivy against the
  # actual built image — both run for real against this repository during
  # that ADR's own writing (not assumed to pass), which is how the
  # Dockerfile fix two steps below (removing pip's own vendored copies of
  # msgpack/setuptools, neither a real-guard-v1 dependency) was found.
  security:
    name: security (pip-audit, Trivy, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans commit history, not just the working tree — a
          # shallow checkout would only see the most recent commit.
          fetch-depth: 0

      - name: gitleaks (full-history secret scan)
        # Phase 9 / docs/adr/0011-phase9-release-preparation.md. Findings are
        # checked against docs/security/gitleaks-baseline.json, generated
        # 2026-09-05 from a full-history scan and manually reviewed line by
        # line — every entry is a test fixture or a documentation example
        # (see the ADR for the per-finding breakdown), never a real
        # credential. A genuinely new secret is *not* in the baseline and
        # still fails this step.
        #
        # ADR 0013 (Phase 9 publication): originally `gitleaks/gitleaks-
        # action@v2`, replaced after the repository's first-ever real CI run
        # showed two problems with it, neither visible from static YAML
        # review — (1) its action.yml declares no `inputs:` at all, so the
        # `args`/`--baseline-path` this step relied on were silently
        # ignored ("Unexpected input(s) 'args'"); (2) lacking that, it falls
        # back to its own push-event before..after diff, which is invalid
        # on a repository's very first push (the "before" ref has no
        # parent — "ambiguous argument ...^..: unknown revision"). Calling
        # the real `gitleaks` binary directly restores the exact full-
        # history, baseline-checked command already verified locally
        # (docs/adr/0011), pinned to the same 8.30.1 release this project
        # verifies with locally.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . -v \
            --baseline-path docs/security/gitleaks-baseline.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit against the production dependency set only
        # Deliberately `pip install .` (base deps), never `.[dev]` — the
        # same set the Dockerfile's runtime image actually ships. A dev-only
        # tool vulnerability (e.g. pytest's own advisories) would fail this
        # step for no reason a production deployment could act on.
        run: |
          python -m venv /tmp/prod-only-venv
          /tmp/prod-only-venv/bin/pip install --quiet --upgrade pip
          /tmp/prod-only-venv/bin/pip install --quiet .
          /tmp/prod-only-venv/bin/pip install --quiet pip-audit
          /tmp/prod-only-venv/bin/pip-audit

      - name: Build the runtime image
        run: docker build -t real-guard-v1:ci-scan .

      - name: Trivy image scan (fixable HIGH/CRITICAL only)
        # `--ignore-unfixed`: a handful of the pinned Debian base image's OS
        # packages carry HIGH/CRITICAL CVEs with no upstream fix available
        # yet (verified against the latest published `python:3.12-slim`
        # digest at the time ADR 0008 was written) — failing CI on a
        # vulnerability nothing in this repository can act on would make
        # the check permanently red through no fault of any future change.
        # Every *fixable* HIGH/CRITICAL finding still fails the build.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 real-guard-v1:ci-scan
