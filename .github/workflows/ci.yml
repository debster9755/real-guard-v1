name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy --strict on app/
        run: mypy app

      - name: Contract validation (policy schema, 54-case corpus, OpenAPI)
        run: python scripts/validate_contracts.py

      - name: pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Docker smoke, README-command, Ollama, security-scan and benchmark jobs
  # are added in their owning phases (WS-15 / Phase 5, WS-16 / Phase 8,
  # WS-17 / Phase 6) rather than stubbed out now — an empty job that always
  # passes is not a real check.
