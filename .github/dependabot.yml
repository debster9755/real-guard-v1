# Dependabot configuration (PLAN.md §13: "Dependabot: on for pip, GitHub
# Actions, and Docker ecosystems"). Schema: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# `npm` (below) is a post-`v0.1.0` addition, not in PLAN.md §13's original
# list — that list predates `web/` (ADR 0014, PR #13). Its absence here is
# exactly why PR #14 ("Bump postcss ... in /web") arrived as an *unconfigured*
# security-update PR rather than a scheduled version-update one: Dependabot's
# security updates run off GitHub's advisory database regardless of this
# file, but routine version bumps for an ecosystem need an explicit entry.
version: 2

updates:
  # Python production + dev dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"

  # Actions referenced in .github/workflows/*.yml (actions/checkout,
  # actions/setup-python, actions/upload-artifact, gitleaks/gitleaks-action).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"

  # Base image pinned in the root Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  # The /console SPA's dependencies (ADR 0014): package.json/package-lock.json
  # under web/.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(npm)"
